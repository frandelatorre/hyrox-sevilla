<script>
/* ----------------------- Simulador mínimo de Google Apps Script ----------------------- */
const chain = () => new Proxy(function () {}, { get: (_, k) => (k === 'then' ? undefined : chain()), apply: () => chain() });

class Sheet {
  constructor(name) { this.name = name; this.rows = []; }
  getName() { return this.name; }
  getLastRow() { return this.rows.length; }
  getLastColumn() { return this.rows.reduce((m, r) => Math.max(m, r.length), 0); }
  getDataRange() { return this.getRange(1, 1, Math.max(1, this.getLastRow()), Math.max(1, this.getLastColumn())); }
  appendRow(a) { this.rows.push(a.slice()); }
  getRange(r, c, nr = 1, nc = 1) { return rangeProxy(new Range(this, r, c, nr, nc)); }
  getSheetId() { return 7; }
  setFrozenRows() {} setColumnWidth() {}
}
class Range {
  constructor(sh, r, c, nr, nc) { Object.assign(this, { sh, r, c, nr, nc }); }
  getValues() { const o = []; for (let i = 0; i < this.nr; i++) { const row = []; for (let j = 0; j < this.nc; j++) { const v = (this.sh.rows[this.r - 1 + i] || [])[this.c - 1 + j]; row.push(v === undefined ? '' : v); } o.push(row); } return o; }
  setValues(v) { v.forEach((row, i) => row.forEach((x, j) => this._set(this.r - 1 + i, this.c - 1 + j, x))); return this._self; }
  getValue() { return this.getValues()[0][0]; }
  setValue(x) { this._set(this.r - 1, this.c - 1, x); return this._self; }
  _set(i, j, x) { while (this.sh.rows.length <= i) this.sh.rows.push([]); const row = this.sh.rows[i]; while (row.length <= j) row.push(''); row[j] = typeof x === 'string' && x[0] === "'" ? x.slice(1) : x; }
  getRow() { return this.r; } getColumn() { return this.c; } getSheet() { return this.sh; }
}
const rangeProxy = r => (r._self = new Proxy(r, { get: (t, k) => (k in t ? (typeof t[k] === 'function' ? t[k].bind(t) : t[k]) : (k === 'then' ? undefined : () => t._self)) }));

const G = {
  sheets: {}, sent: [], quota: 100, props: {}, cache: {}, triggers: [], now: null,
  me: 'ritmo@example.com', meThrows: false, urlFails: false,
  reset() { this.sheets = {}; this.sent = []; this.quota = 100; this.props = {}; this.cache = {}; this.triggers = []; this.failFor = null; this.me = 'ritmo@example.com'; this.meThrows = false; this.urlFails = false; },
};
const SpreadsheetApp = {
  getActive: () => ({
    getUrl() { if (G.urlFails) throw new Error('sin permiso'); return 'https://docs.google.com/spreadsheets/d/TEST/edit'; },
    setSpreadsheetTimeZone() {},
    getSheetByName: n => G.sheets[n] || null,
    insertSheet: n => (G.sheets[n] = new Sheet(n)),
    getSheets: () => Object.values(G.sheets),
    deleteSheet(s) { delete G.sheets[s.name]; },
  }),
  getUi: () => chain(), newDataValidation: () => chain(),
};
const MailApp = {
  getRemainingDailyQuota: () => G.quota - G.sent.length,
  sendEmail(o) { if (G.failFor && o.to === G.failFor) throw new Error('Dirección inválida: ' + o.to); G.sent.push(o); },
};
const Utilities = {
  getUuid: () => crypto.randomUUID(),
  formatDate(d, tz, f) {
    const p = {}; new Intl.DateTimeFormat('en-GB', { timeZone: tz, year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hour12: false }).formatToParts(d).forEach(x => (p[x.type] = x.value));
    return f.replace('yyyy', p.year).replace('MM', p.month).replace('dd', p.day).replace('HH', p.hour).replace('mm', p.minute);
  },
};
const CacheService = { getScriptCache: () => ({ get: k => G.cache[k] || null, put: (k, v) => { G.cache[k] = v; }, remove: k => { delete G.cache[k]; } }) };
const PropertiesService = { getScriptProperties: () => ({ getProperty: k => G.props[k] || null, setProperty: (k, v) => { G.props[k] = v; } }) };
const LockService = { getScriptLock: () => ({ waitLock() {}, releaseLock() {} }) };
const ContentService = { MimeType: { JSON: 'json' }, createTextOutput: s => ({ s, setMimeType() { return this; }, getContent() { return this.s; } }) };
const ScriptApp = {
  getProjectTriggers: () => G.triggers.map(h => ({ getHandlerFunction: () => h })),
  deleteTrigger() { G.triggers = []; },
  newTrigger: h => ({ timeBased: () => ({ everyDays: () => ({ atHour: () => ({ create() { G.triggers.push(h); } }) }) }) }),
};
const Session = { getEffectiveUser: () => { if (G.meThrows) throw new Error('sin cuenta'); return { getEmail: () => G.me }; } };
const Logger = { log() {} };

/* ----------------------------------- Carga de los .gs ----------------------------------- */
async function load() {
  for (const f of ['Code.gs', 'Mail.gs', 'Stats.gs']) {
    const s = document.createElement('script');
    s.textContent = await (await fetch('../' + f, { cache: 'no-store' })).text();
    document.head.appendChild(s);
  }
}

/* ----------------------------------------- Pruebas ----------------------------------------- */
const results = [];
function check(name, cond, extra) { results.push({ name, ok: !!cond, extra: cond ? '' : extra }); }
const post = body => JSON.parse(doPost({ postData: { contents: JSON.stringify(body) } }).getContent());
const subs = () => table_(T.SUBS).rows;
const form = (o = {}) => Object.assign({ action: 'signup', email: 'ana@example.com', ciudad: 'sevilla', carrera: 'malaga', ms: 5000, origen: '/' }, o);
const tokenOf = html => (html.match(/\?t=([a-f0-9]{32})/) || [])[1];
const lastMail = () => G.sent[G.sent.length - 1];

async function run() {
  await load();
  G.reset();
  setup();
  const cfgSheet = G.sheets['Config'];
  check('setup crea las 7 hojas', ['Suscriptores', 'Contactos', 'Campañas', 'Envíos', 'Config', 'Registro', 'Propuestas'].every(n => G.sheets[n]));
  check('setup crea disparador diario y contraseña', G.triggers.join() === 'runDailyJob' && G.props.PANEL_PASSWORD && G.props.PANEL_PASSWORD.length >= 12);
  check('setup crea campaña de ejemplo en Borrador', table_(T.CAMP).rows.length === 1 && table_(T.CAMP).rows[0].estado === 'Borrador');
  const before = G.props.PANEL_PASSWORD; setup();
  check('setup repetido no cambia la contraseña ni duplica el disparador', G.props.PANEL_PASSWORD === before && G.triggers.length === 1);

  // --- Alta de un solo paso
  const clearThrottle = () => Object.keys(G.cache).filter(k => k.startsWith('sg:')).forEach(k => delete G.cache[k]);
  check('email inválido se rechaza', post(form({ email: 'nope' })).error === 'email');
  check('ciudad desconocida se rechaza', post(form({ ciudad: 'xx' })).error === 'ciudad');
  post(form({ email: 'bot@example.com', web: 'http://spam' }));
  post(form({ email: 'rapido@example.com', ms: 300 }));
  check('bot (campo trampa) y envío instantáneo no crean fila ni envían nada', subs().length === 0 && G.sent.length === 0);

  let r = post(form());
  check('alta correcta responde ok y devuelve el enlace del plan', r.ok === true && /\.pdf$/.test(r.plan), JSON.stringify(r));
  const s0 = subs()[0];
  check('queda Confirmado al instante, con consentimiento, versión del texto y fecha', s0.estado === 'Confirmado' && s0.marketing === 'SI' && s0.consentimiento === CONSENT_VERSION && s0.fecha_confirmacion instanceof Date && /^[a-f0-9]{32}$/.test(s0.token), JSON.stringify(s0));
  check('se envía un único email: el plan, con enlace de baja y el aviso de las comunicaciones', G.sent.length === 1 && G.sent[0].to === 'ana@example.com' && /plan de 16 semanas/.test(G.sent[0].subject) && G.sent[0].htmlBody.includes('/baja/?t=' + s0.token) && /de vez en cuando/.test(G.sent[0].htmlBody) && /no has sido tú/.test(G.sent[0].htmlBody));
  check('no se envía ningún email de confirmación', !G.sent.some(m => /Confirma tu email/.test(m.subject)));
  check('el email lleva texto plano con el enlace de descarga', G.sent[0].body.includes('.pdf'));
  r = post(form());
  check('doble envío en 1 minuto no manda otro email y sigue dando el enlace', G.sent.length === 1 && /\.pdf$/.test(r.plan));
  const firstConsent = +s0.fecha_confirmacion;
  clearThrottle(); post(form({ carrera: 'madrid' }));
  check('repetir el alta reutiliza la fila, actualiza la carrera, reenvía el plan y no cambia la fecha de consentimiento', subs().length === 1 && subs()[0].carrera === 'madrid' && G.sent.length === 2 && +subs()[0].fecha_confirmacion === firstConsent);
  for (let i = 0; i < 6; i++) { clearThrottle(); post(form()); }
  check('máximo 6 emails del plan por persona', G.sent.length === 6, G.sent.length);

  // --- Baja y re-alta
  const tok = subs()[0].token;
  check('baja con token mal formado o desconocido se rechaza', post({ action: 'unsub', token: 'x' }).error === 'token' && post({ action: 'unsub', token: 'a'.repeat(32) }).error === 'token');
  r = post({ action: 'unsub', token: tok });
  check('la baja funciona con un clic', r.ok && subs()[0].estado === 'Baja' && subs()[0].marketing === 'NO');
  const sentBefore = G.sent.length;
  clearThrottle(); post(form());
  check('re-alta tras la baja: vuelve a Confirmado, token nuevo y recibe el plan', subs()[0].estado === 'Confirmado' && subs()[0].token !== tok && G.sent.length === sentBefore + 1);
  check('el enlace de baja antiguo ya no afecta a la nueva alta', post({ action: 'unsub', token: tok }).error === 'token' && subs()[0].estado === 'Confirmado');

  // --- Enlaces de confirmación antiguos (de antes del alta de un solo paso)
  appendObj_(T.SUBS, { id: 'old1', fecha_alta: new Date(), email: 'antiguo@example.com', ciudad: 'sevilla', estado: 'Pendiente', marketing: 'SI', token: 'b'.repeat(32), emails_confirmacion: 1 });
  r = post({ action: 'confirm', token: 'b'.repeat(32) });
  check('un enlace de confirmación antiguo activa el alta y envía el plan', r.ok && subs().find(s => s.email === 'antiguo@example.com').estado === 'Confirmado' && lastMail().to === 'antiguo@example.com');
  const n2 = G.sent.length; post({ action: 'confirm', token: 'b'.repeat(32) });
  check('confirmar dos veces no repite el email', G.sent.length === n2);

  // --- Casos límite
  clearThrottle(); post(form({ email: 'inj@example.com', origen: '=HYPERLINK("http://x","y")' }));

  check('ningún email sale hacia terceros: solo a quien pidió el plan', G.sent.every(m => /^(ana|antiguo|inj)@example\.com$/.test(m.to)));
  G.sent = [];

  check('límite de 40 altas por hora: el resto recibe "busy" y no se les envía nada', busy > 0 && G.sent.length === 45 - busy && G.sent.length <= 40, busy + ' busy, ' + G.sent.length + ' enviados');

  for (let i = 0; i < 6; i++) mk('s' + i + '@example.com', 'sevilla');
  mk('m1@example.com', 'madrid'); mk('no@example.com', 'sevilla', 'NO'); mk('baja@example.com', 'sevilla', 'SI', 'Baja'); mk('pend@example.com', 'sevilla', 'SI', 'Pendiente');
  const camp = table_(T.CAMP).rows[0];
  updateObj_(T.CAMP, camp._row, { estado: 'Programada', fecha_envio: new Date(Date.now() - 864e5), publi_activa: 'SI', publi_titulo: 'Clase gratis', publi_texto: 'Prueba en [Good Training](https://goodtraining.es)', publi_enlace: 'https://goodtraining.es', cuerpo: 'Hola <script>alert(1)<\/script>\n\n- uno\n- dos\n\n**Importante** [web](https://ritmohibrido.com)' });
  G.sent = []; G.quota = 10 + 4; // reserva 10 → 4 disponibles
  runDailyJob();
  let c = table_(T.CAMP).rows[0];
  check('respeta la cuota: envía solo 4 y queda En curso', G.sent.length === 4 && c.estado === 'En curso' && c.enviados === 4, JSON.stringify({ n: G.sent.length, e: c.estado, en: c.enviados }));
  check('solo a confirmados con consentimiento (no baja, no pendiente, no "No")', G.sent.every(m => !/^(no|baja|pend)@/.test(m.to)));
  G.quota = 100; G.sent = [];
  runDailyJob();
  c = table_(T.CAMP).rows[0];
  check('al día siguiente termina sin repetir a nadie', G.sent.length === 3 && c.estado === 'Enviada' && c.enviados === 7, JSON.stringify({ n: G.sent.length, e: c.estado, en: c.enviados }));
  const all = table_(T.SENDS).rows.filter(r => r.resultado === 'OK').map(r => r.email);
  check('el registro de envíos no tiene duplicados', new Set(all).size === all.length && all.length === 7);
  G.sent = []; runDailyJob();
  check('una campaña Enviada no se vuelve a enviar', G.sent.length === 0);
  const html = G.reset || '';
  // contenido del último email
  G.sent = []; updateObj_(T.CAMP, camp._row, { estado: 'Programada', segmento_ciudad: 'Sevilla' }); sheet_(T.SENDS).getDataRange(); G.sheets['Envíos'].rows.length = 1; runDailyJob();
  const m = G.sent[0];
  check('segmento por ciudad: solo Sevilla', G.sent.length === 6 && G.sent.every(x => /^s\d@/.test(x.to)), G.sent.map(x => x.to).join());
  check('el HTML escapa scripts', !m.htmlBody.includes('<script>') && m.htmlBody.includes('&lt;script&gt;'));
  check('la publicidad va etiquetada', m.htmlBody.includes('Publicidad'));
  check('lleva enlace de baja personal', /\/baja\/\?t=[a-f0-9]{32}/.test(m.htmlBody));
  check('listas y negritas se convierten', m.htmlBody.includes('<li') && m.htmlBody.includes('<strong>Importante</strong>'));
  check('el remitente y el responsable salen en el pie', m.name === 'Ritmo Híbrido' && m.htmlBody.includes('Responsable'));
  updateObj_(T.CAMP, camp._row, { estado: 'Programada' }); G.sent = []; G.failFor = 's1@example.com'; G.sheets['Envíos'].rows.length = 1; runDailyJob(); runDailyJob(); runDailyJob();
  const errs = table_(T.SENDS).rows.filter(r => r.resultado === 'ERROR' && r.email === 's1@example.com').length;
  check('una dirección que falla se reintenta máximo 2 veces y la campaña termina', errs === 2 && table_(T.CAMP).rows[0].estado === 'Enviada', errs + ' ' + table_(T.CAMP).rows[0].estado);
  G.failFor = null;

  // --- onEdit
  appendObj_(T.LEADS, { id: 'L1', fecha: new Date(), email: 'a@example.com', ciudad: 'sevilla', estado: 'Cerrado' });
  const sh = G.sheets['Contactos']; const head = sh.rows[0];
  onEdit({ range: sh.getRange(2, head.indexOf('estado') + 1), value: 'Cerrado' });
  const l = table_(T.LEADS).rows[0];
  check('al marcar Cerrado se rellenan fecha y comisión por defecto', l.fecha_cierre instanceof Date && l.comision === 30, JSON.stringify(l));

  // --- Panel
  check('panel sin contraseña correcta se rechaza', post({ action: 'stats', password: 'mal' }).error === 'bad');
  r = post({ action: 'stats', password: G.props.PANEL_PASSWORD });
  check('panel con la contraseña devuelve datos', r.ok && r.stats.kpis && r.stats.embudo.length === 6 && r.stats.sistema, JSON.stringify(r).slice(0, 200));
  const k = r.stats.kpis;

  check('12 semanas y las altas recientes cuentan en la última', r.stats.semanas.length === 12 && r.stats.semanas[11].altas === 9 && r.stats.semanas[11].bajas === 0, JSON.stringify(r.stats.semanas[11]));
  check('sistema informa cuota y disparador', r.stats.sistema.triggers.includes('runDailyJob') && typeof r.stats.sistema.cuotaRestante === 'number');
  for (let i = 0; i < 5; i++) post({ action: 'stats', password: 'x' + i });
  check('5 fallos bloquean el panel aunque la contraseña sea buena', post({ action: 'stats', password: G.props.PANEL_PASSWORD }).error === 'locked');
  check('acción desconocida y JSON roto no tumban el servidor', post({ action: 'zzz' }).error === 'accion' && JSON.parse(doPost({ postData: { contents: '{' } }).getContent()).error === 'server');

  // --- Provincias
  G.reset(); setup();
  const slugs = Object.keys(PROVINCES);
  check('la lista tiene 50 provincias + Ceuta + Melilla + "otra" (53), con slugs sin tildes ni espacios',
    slugs.length === 53 && slugs.every(k => /^[a-z]+(-[a-z]+)*$/.test(k)) && PROVINCES.ceuta === 'Ceuta' && PROVINCES.melilla === 'Melilla' && PROVINCES.otra === 'Fuera de España', slugs.length);

    ['a-coruna', 'alava', 'bizkaia', 'illes-balears', 'las-palmas', 'santa-cruz-de-tenerife'].every(k => PROVINCES[k]));
  check('los alias apuntan a provincias que existen', Object.values(PROVINCE_ALIASES).every(k => PROVINCES[k]) && PROVINCE_ALIASES.bilbao === 'bizkaia');

  clearThrottle();
  r = post(form({ email: 'sct@example.com', ciudad: 'santa-cruz-de-tenerife' }));
  check('alta con provincia de varias palabras (santa-cruz-de-tenerife)', r.ok === true && subs().find(s => s.email === 'sct@example.com').ciudad === 'santa-cruz-de-tenerife', JSON.stringify(r));
  clearThrottle();
  r = post(form({ email: 'bil@example.com', ciudad: 'bilbao' }));
  check('alta con valor antiguo (bilbao): se acepta y se guarda como bizkaia', r.ok === true && subs().find(s => s.email === 'bil@example.com').ciudad === 'bizkaia', JSON.stringify(r));
  const legacy = ['sevilla', 'madrid', 'malaga', 'valencia', 'barcelona', 'bilbao', 'otra'];
  legacy.forEach((v, i) => { clearThrottle(); post(form({ email: 'leg' + i + '@example.com', ciudad: v })); });
  check('los 7 valores antiguos del formulario siguen aceptándose', legacy.every((v, i) => { const s = subs().find(x => x.email === 'leg' + i + '@example.com'); return s && s.ciudad === (v === 'bilbao' ? 'bizkaia' : v); }));
  const nSubs = subs().length, nSent = G.sent.length;
  ['xx', '', 'constructor', '__proto__', 'toString', 'a-coruna-xx'].forEach(v => { clearThrottle(); post(form({ email: 'mal@example.com', ciudad: v })); });
  check('valor inválido rechazado (desconocido, vacío, nombres internos de objeto): sin fila ni email', post(form({ email: 'mal@example.com', ciudad: 'xx' })).error === 'ciudad' && subs().length === nSubs && G.sent.length === nSent);

  // Campañas por provincia: 2 de Sevilla, 1 de Cádiz, 1 de Huelva, 1 de Madrid, 1 antiguo "bilbao", 1 "bizkaia", 1 de Zaragoza
  G.reset(); setup();
  const mk2 = (email, ciudad) => appendObj_(T.SUBS, { id: shortId_(), fecha_alta: new Date(), email, ciudad, carrera: 'malaga', origen: '/', estado: 'Confirmado', marketing: 'SI', fecha_confirmacion: new Date(), token: token_(), emails_confirmacion: 1 });
  [['s1', 'sevilla'], ['s2', 'sevilla'], ['c1', 'cadiz'], ['h1', 'huelva'], ['m1', 'madrid'], ['b1', 'bilbao'], ['b2', 'bizkaia'], ['z1', 'zaragoza']].forEach(([n, c]) => mk2(n + '@example.com', c));
  const camp2 = table_(T.CAMP).rows[0];
  const runCamp = seg => {
    updateObj_(T.CAMP, camp2._row, { estado: 'Programada', fecha_envio: new Date(Date.now() - 864e5), segmento_ciudad: seg, enviados: 0, errores: 0 });
    G.sheets['Envíos'].rows.length = 1; G.sent = []; G.quota = 100;
    runDailyJob();
    return G.sent.map(m => m.to.split('@')[0]).sort().join(',');
  };
  const dest = seg => { updateObj_(T.CAMP, camp2._row, { estado: 'Programada', segmento_ciudad: seg }); return post({ action: 'stats', password: G.props.PANEL_PASSWORD }).stats.emails[0]; };

  check('campaña sin segmento: va a todos (8)', runCamp('') === 'b1,b2,c1,h1,m1,s1,s2,z1');
  check('campaña con una provincia: solo esa', runCamp('sevilla') === 's1,s2');
  check('campaña con una provincia, mayúsculas y tildes: "Cádiz"', runCamp('Cádiz') === 'c1');
  check('campaña con varias provincias separadas por comas', runCamp('sevilla, cadiz, huelva') === 'c1,h1,s1,s2', runCamp('sevilla, cadiz, huelva'));
  check('varias provincias con espacios, tildes y mayúsculas mezclados', runCamp(' Sevilla ,CÁDIZ;  huelva ') === 'c1,h1,s1,s2');
  check('el alias bilbao como segmento llega a los guardados como bilbao y como bizkaia', runCamp('bilbao') === 'b1,b2' && runCamp('bizkaia') === 'b1,b2');
  check('un suscriptor antiguo "bilbao" entra en una lista de varias provincias con bizkaia', runCamp('madrid, bizkaia') === 'b1,b2,m1');
  const lenBefore = G.sheets['Registro'].rows.length;
  check('segmento con una errata se ignora solo esa parte y se avisa en el Registro', runCamp('sevilla, cadis') === 's1,s2' && G.sheets['Registro'].rows.length > lenBefore);
  check('segmento solo con erratas: no se envía a nadie, NO se interpreta como "todos" y la campaña sigue Programada', runCamp('sevila') === '' && table_(T.CAMP).rows[0].estado === 'Programada');
